[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "専用worktree・固定budget・schema検証・DLPで囲った短命のローカルAI orchestrator"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
orc = "orc.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["orc"]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-jsonschema>=4.26.0.20260518",
]
